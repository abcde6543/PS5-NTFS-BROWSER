# Builds the PS5 payload from source and publishes a GitHub release whenever
# a version tag (v*) is pushed. Release notes come from
# docs/releases/<tag>.md when that file exists.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.1.0"
        required: true

permissions:
  contents: write

env:
  # The PS5 payload SDK version this project is built and tested with.
  SDK_REF: a7685ce8e97ce1f8a4f38253a41d54241c9124f1

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Pick tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 wget make

      - name: Cache PS5 payload SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/ps5-payload-sdk
          key: ps5-sdk-${{ env.SDK_REF }}

      - name: Build PS5 payload SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/ps5-payload-dev/sdk.git /tmp/sdk
          git -C /tmp/sdk checkout "$SDK_REF"
          make -C /tmp/sdk DESTDIR="$HOME/ps5-payload-sdk" install

      - name: Build payload and package
        run: |
          make clean
          make ps5 PS5_PAYLOAD_SDK="$HOME/ps5-payload-sdk"
          make dist PS5_PAYLOAD_SDK="$HOME/ps5-payload-sdk"
          sha256sum ntfs-browser.elf ntfs-browser-v*.zip | tee SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          notes="docs/releases/${TAG}.md"
          [ -f "$notes" ] || { echo "Release ${TAG}" > /tmp/notes.md; notes=/tmp/notes.md; }
          cp "$notes" /tmp/release-notes.md
          printf '\n### Checksums (SHA-256)\n```\n%s\n```\n' "$(cat SHA256SUMS)" >> /tmp/release-notes.md
          title="NTFS Browser ${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ntfs-browser.elf ntfs-browser-v*.zip SHA256SUMS --clobber
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" ntfs-browser.elf ntfs-browser-v*.zip SHA256SUMS \
              --title "$title" --notes-file /tmp/release-notes.md
          fi
